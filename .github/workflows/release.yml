name: Release

# Every push to main ships the next patch version to GitHub Releases.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "verification/**"
      - "LICENSE"
  workflow_dispatch:

# Serialize releases so two pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      XCODE_VERSION: "26.6"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check secrets
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APP_P12 INSTALLER_P12 P12_PASSWORD ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see README › Releases)"
            exit 1
          fi

      - name: Next patch version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -z "$last" ]; then
            version="0.1.0"
          else
            version=$(echo "${last#v}" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: ${last:-none})"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Core tests
        run: swift test --package-path Packages/VaasiKit

      - name: App tests
        run: |
          set -o pipefail
          xcodebuild -project Vaasi.xcodeproj -scheme Vaasi -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData -only-testing:VaasiTests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test | tail -40

      - name: Import signing identities
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for name in APP_P12 INSTALLER_P12; do
            printf '%s' "${!name}" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" \
              -T /usr/bin/codesign -T /usr/bin/productsign
            rm "$RUNNER_TEMP/identity.p12"
          done
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security find-identity -v "$keychain" | grep -c "Developer ID" | grep -qx 2
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Install and launch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo installer -pkg "dist/Vaasi-$VERSION.pkg" -target /
          app=/Applications/Vaasi.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION" ]
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          spctl --assess --type open --context context:primary-signature --verbose "dist/Vaasi-$VERSION.dmg"
          open "$app"
          sleep 10
          pgrep -x Vaasi >/dev/null || { echo "::error::Vaasi quit right after launch"; exit 1; }
          echo "Vaasi $VERSION is running"
          pkill -x Vaasi || true

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/identity.p12"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
          notes="Download the DMG, open it, and drag Vaasi to Applications. Needs macOS 26 on Apple Silicon or Intel. Installed copies update themselves."
          gh release create "v$VERSION" --draft --title "Vaasi $VERSION" --generate-notes --notes "$notes" \
            "dist/Vaasi-$VERSION.dmg" "dist/Vaasi-$VERSION.zip" "dist/Vaasi-$VERSION.pkg" dist/appcast.xml
          check=$(mktemp -d)
          gh release download "v$VERSION" --pattern appcast.xml --pattern "Vaasi-$VERSION.zip" --dir "$check"
          cmp dist/appcast.xml "$check/appcast.xml"
          cmp "dist/Vaasi-$VERSION.zip" "$check/Vaasi-$VERSION.zip"
          gh release edit "v$VERSION" --draft=false --latest
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION"
